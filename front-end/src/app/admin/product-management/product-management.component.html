<div class="container">
    <div class="espaco"></div>
    <h1>Produtos Cadastrados</h1>
    <div *ngIf="products.length === 0">
        <p>Nenhum produto cadastrado.</p>
    </div>
    <div class="espaco"></div>
    <div class="table-responsive">
       <table *ngIf="products.length > 0">
        <thead>
            <tr>
                <th scope="col">Imagem</th>
                <th scope="col">Nome</th>
                <th scope="col">Preço</th>
                <th scope="col">Descrição</th>
                <th scope="col">Categoria</th>
                <th scope="col">Estoque</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let product of products">
                <td><img [src]="product.imagem" alt="{{product.nome}}" width="75" height="85">
                </td>
                <td>{{product.nome}}</td>
                <td>{{product.preco | currency:'BRL':'symbol'}}</td>
                <td>{{product.descricao}}</td>
                <td>{{product.categoria}}</td>
                <td>{{product.quantidade}}</td>
            </tr>
        </tbody>
    </table> 
    </div>
    
    <div class="espaco"></div>
    <h2>Cadastrar produtos</h2>
    <div class="espaco"></div>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" formControlName="nome" class="form-control" />
        </div>
        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" formControlName="descricao" class="form-control"></textarea>
        </div>
        <div class="form-group">
            <label for="preco">Preço</label>
            <input type="text" id="preco" formControlName="preco" class="form-control" />
        </div>
        <div class="form-group">
            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" formControlName="categoria" class="form-control" />
        </div>
        <div class="form-group">
            <label for="imagem">URL da Imagem</label>
            <input type="text" id="imagem" formControlName="imagem" class="form-control" />
        </div>
        <div class="espaco"></div>
        <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
    </form>


    <div class="espaco"></div>
</div>
