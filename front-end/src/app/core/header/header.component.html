<header [ngClass]="{'logged-in-header': isLoggedIn}">
    <div class="container">
        <div class="logo">
            <img src="assets/img/logo.png" alt="Logo da Empresa">
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Pesquisar" [(ngModel)]="searchQuery" (input)="onSearch()">
            <img src="assets/img/search.png" alt="Pesquisar">
        </div>
        <div *ngIf="searchResults.length > 0" class="search-results">
            <div *ngFor="let product of searchResults" class="search-result-item"> <img [src]="product.imagem"
                    alt="{{product.nome}}" class="result-image">
                <div class="result-details">
                    <h3>{{ product.nome }}</h3> 
                    <button (click)="adicionarAosFavoritos(product)"><i class="fa-solid fa-heart fa-xl"
                        style="color: #830000;"></i></button>
                    <button (click)="adicionarAoCarrinho(product)"><i class="fa-solid fa-cart-shopping fa-xl"
                        style="color: #DAA520;"></i></button>
                </div>
            </div>
        </div>
        <div class="user-actions">
            <div class="user-icon">
                <img src="assets/img/user.png" alt="Login">
                <a *ngIf="isLoggedIn; else loginLink" routerLink="/perfil"><span id="login">Minha Conta</span></a>
                <ng-template #loginLink> <a routerLink="/cadastro">Minha Conta</a> </ng-template>
                <button *ngIf="isLoggedIn" (click)="logout()">Sair</button>
            </div>
            <div class="cart-icon">
                <img src="assets/img/cart.png" alt="Carrinho">
                <a [routerLink]="['/carrinho']"><span id="cart-value">{{ totalQuantity }} itens<br>R${{
                        totalPrice.toFixed(2) }}</span></a>
            </div>
        </div>
    </div>
    <div class="nav-container">
        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation" (click)="toggleMenu()">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent" [ngClass]="{'show': menuOpen}">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0">
                        <li class="nav-item" id="home">
                            <a class="nav-link" aria-current="page" routerLink="" (click)="toggleMenu()">Home</a>
                        </li>
                        <li class="nav-item" id="sobre">
                            <a class="nav-link" routerLink="/sobre" (click)="toggleMenu()">Sobre</a>
                        </li>
                        <li class="nav-item dropdown" id="cardapio">
                            <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">Cardápio</a>
                            <ul class="dropdown-menu">
                                <li id="baunilha"><a class="dropdown-item" routerLink="/cardapio/#baunilha"
                                        (click)="toggleMenu()">Baunilha</a></li>
                                <li id="chocolate"><a class="dropdown-item" routerLink="/cardapio/#chocolate"
                                        (click)="toggleMenu()">Chocolate</a></li>
                                <li id="coco"><a class="dropdown-item" routerLink="/cardapio/#coco"
                                        (click)="toggleMenu()">Coco</a></li>
                                <li id="laranja"><a class="dropdown-item" routerLink="/cardapio/#laranja"
                                        (click)="toggleMenu()">Laranja</a></li>
                                <li id="todos"><a class="dropdown-item" routerLink="/cardapio"
                                        (click)="toggleMenu()">Todos</a></li>
                            </ul>
                        </li>
                        <li class="nav-item" id="duvidas"><a class="nav-link" routerLink="/duvidas"
                                (click)="toggleMenu()">Dúvidas</a></li>
                        <li class="nav-item" id="faleConosco"><a class="nav-link"
                                href="https://api.whatsapp.com/send?phone=5511900000000" target="_blank">Fale
                                Conosco</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
</header>
