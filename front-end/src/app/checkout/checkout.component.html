<app-cover></app-cover>
<div class="espaco"></div>
<div class="container">
    <h1>Checkout</h1>
    <div class="espaco"></div>
    <form>
      <div class="form-group">
        <label for="name">Nome no Cartão</label>
        <input type="text" id="name" formControlName="name" class="form-control" />
      </div>
      <div class="form-group">
        <label for="cardNumber">Número do Cartão</label>
        <input type="text" id="cardNumber" formControlName="cardNumber" class="form-control" />
      </div>
      <div class="form-group">
        <label for="expiryDate">Data de Validade (MM/AA)</label>
        <input type="text" id="expiryDate" formControlName="expiryDate" class="form-control" />
      </div>
      <div class="form-group">
        <label for="cvv">CVV</label>
        <input type="text" id="cvv" formControlName="cvv" class="form-control" />
      </div>
      <div class="espaco"></div>
      <div class="form-group">
        <button type="submit" class="btn btn-primary">Pagar</button>
      </div>
    </form>
    <div class="espaco"></div>
  </div>
